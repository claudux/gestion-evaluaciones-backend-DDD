services:
  evaluaciones-db:
    image: postgres:16-alpine
    container_name: gestion-evaluaciones-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestion_evaluaciones_db
      POSTGRES_USER: evaluaciones_user
      POSTGRES_PASSWORD: evaluaciones_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_evaluaciones_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evaluaciones_user -d gestion_evaluaciones_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_evaluaciones_data:
    driver: local
